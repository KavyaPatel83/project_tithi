<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Monitoring System</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Roboto', sans-serif;
}
body {
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Logo at top */
.logo-container {
    position: absolute;
    top: 20px;      
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;    
}
.logo-container img {
    width: 80px;    
    height: 80px;
    border-radius: 10px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* Floating particles */
.particles {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
}
.particle {
    position: absolute;
    width: 15px;
    height: 15px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    animation: float 10s linear infinite;
}
@keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity:0; }
    50% { opacity:1; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity:0; }
}

/* Wave Animation */
.wave {
    position: absolute;
    bottom: 0;
    width: 200%;
    height: 200px;
    background: rgba(255,255,255,0.1);
    border-radius: 45%;
    animation: wave 8s ease-in-out infinite;
}
@keyframes wave {
    0%,100% { transform: translateX(0); }
    50% { transform: translateX(-50%); }
}

/* Main content */
.content {
    position: relative;
    z-index: 2;
    color: #fff;
    text-align: center;
}
.content h1 {
    font-size: 3em;
    margin-bottom: 20px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
}
.content p {
    font-size: 1.5em;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.2);
    margin-bottom: 30px;
}

/* Center button */
.content button {
    padding: 15px 40px;
    font-size: 1.2em;
    border: none;
    border-radius: 30px;
    background: #fff;
    color: #0072ff;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
}
.content button:hover {
    background: #0072ff;
    color: #fff;
    transform: scale(1.05);
}

/* Floating icons */
.icon {
    position: absolute;
    width: 50px;
    height: 50px;
    opacity: 0.8;
    animation: floatIcon 10s linear infinite;
}
@keyframes floatIcon {
    0% { transform: translateY(100vh) rotate(0deg);}
    100% { transform: translateY(-50px) rotate(360deg);}
}
</style>
</head>
<body>

<!-- Logo at top -->
<div class="logo-container">
    <img src="https://cdn-icons-png.flaticon.com/512/833/833472.png" alt="Health Logo">
</div>

<div class="particles" id="particles"></div>

<div class="wave"></div>

<div class="content">
    <h1>Welcome to Health Monitoring</h1>
    <p>Track your health with real-time analytics!</p>
    <!-- New button -->
    
    
    <button onclick="location.href='Registration.html'">Registration</button>"
    
    
</div>

<!-- Floating health icons -->
<img src="https://cdn-icons-png.flaticon.com/512/2965/2965567.png" class="icon" style="top:10%; left:20%; animation-delay: 0s;">
<img src="https://cdn-icons-png.flaticon.com/512/2965/2965568.png" class="icon" style="top:30%; left:70%; animation-delay: 2s;">
<img src="https://cdn-icons-png.flaticon.com/512/2965/2965570.png" class="icon" style="top:50%; left:40%; animation-delay: 4s;">
<img src="https://cdn-icons-png.flaticon.com/512/2965/2965571.png" class="icon" style="top:70%; left:60%; animation-delay: 6s;">

<script>
// Generate floating particles dynamically
const particlesContainer = document.getElementById('particles');
for(let i=0; i<50; i++){
    const p = document.createElement('div');
    p.classList.add('particle');
    p.style.left = Math.random()*100 + 'vw';
    p.style.width = p.style.height = (5 + Math.random()*15) + 'px';
    p.style.animationDuration = (5 + Math.random()*10) + 's';
    particlesContainer.appendChild(p);
}
</script>

</body>
</html>
