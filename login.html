<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Monitoring Login</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Roboto', sans-serif;
}

/* BODY */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #6dd5ed, #2193b0);
    overflow: hidden;
}

/* BACKGROUND ANIMATION */
.bg-animation {
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 1%, transparent 1%);
    background-size: 50px 50px;
    animation: move 20s linear infinite;
    z-index: 1;
}
@keyframes move {
    0% { transform: translate(0,0); }
    100% { transform: translate(-50px,-50px); }
}

/* LOGIN FORM */
.login-container {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    padding: 50px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    text-align: center;
    width: 350px;
    animation: fadeIn 1s ease forwards;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px);}
    to { opacity: 1; transform: translateY(0);}
}

/* LOGO */
.logo {
    width: 80px;
    height: 80px;
    margin-bottom: 20px;
    animation: bounce 2s infinite;
}
@keyframes bounce {
    0%, 100% { transform: translateY(0);}
    50% { transform: translateY(-15px);}
}

/* INPUTS */
input {
    width: 100%;
    padding: 15px 20px;
    margin: 10px 0;
    border: none;
    border-radius: 50px;
    outline: none;
    font-size: 16px;
    transition: all 0.3s ease;
    background: rgba(255,255,255,0.2);
    color: #fff;
}
input:focus {
    background: rgba(255,255,255,0.4);
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
}

/* BUTTON */
button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 50px;
    background: #fff;
    color: #2193b0;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}
button::before {
    content: '';
    position: absolute;
    width: 300%;
    height: 300%;
    top: -100%;
    left: -100%;
    background: rgba(33,147,176,0.3);
    transform: rotate(45deg);
    transition: all 0.5s ease;
}
button:hover::before {
    top: -50%;
    left: -50%;
}
button:hover {
    color: #fff;
    background: #2193b0;
}

/* HEADER */
.login-container h2 {
    color: #fff;
    margin-bottom: 30px;
}

/* ERROR MESSAGE */
#errorMsg {
    color: #ff4d4d;
    margin-top: 10px;
}
</style>
</head>
<body>

<div class="bg-animation"></div>

<div class="login-container">
    <img src="https://cdn-icons-png.flaticon.com/512/833/833472.png" class="logo">
    <h2>Health Monitoring</h2>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <p id="errorMsg"></p>
    </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    // Your fixed login details
    if(email === "ta0122007@gmail.com" && password === "Tithi0712"){
        window.location.href = "detailpage.html";
    } else {
        document.getElementById("errorMsg").innerText = "Invalid Email or Password ❌";
    }
});
</script>

</body>
</html>
