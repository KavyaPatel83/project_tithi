<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Monitoring - Registration</title>
<style>
:root {
    --medical-blue: #0284c7;
    --trust-navy: #0f172a;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.reg-card {
    background: #ffffff;
    width: 100%;
    max-width: 520px;
    border-radius: 32px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    padding: 40px;
}

.logo-container {
    text-align: center;
    margin-bottom: 30px;
}

.health-logo {
    width: 70px;
    height: 70px;
    background: #e0f2fe;
    border-radius: 20px;
    padding: 12px;
    display: inline-block;
}

.header-text h2 {
    margin: 15px 0 5px;
    color: var(--trust-navy);
    font-size: 1.8rem;
}

.header-text p {
    color: #64748b;
    font-size: 0.9rem;
}

.input-box {
    margin-bottom: 18px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--trust-navy);
    margin-bottom: 6px;
    text-transform: uppercase;
}

input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    font-size: 0.95rem;
    transition: all 0.2s;
}

input:focus, select:focus {
    outline: none;
    border-color: var(--medical-blue);
    box-shadow: 0 0 0 3px rgba(2,132,199,0.1);
}

.btn-submit {
    width: 100%;
    background: var(--medical-blue);
    color: white;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 15px;
    transition: background 0.2s;
}

.btn-submit:hover {
    background: #0369a1;
}

#errorMsg {
    color: #dc2626;
    text-align: center;
    margin-top: 15px;
    font-size: 0.85rem;
    padding: 8px;
    border-radius: 8px;
}

.success-msg {
    color: #10b981 !important;
    background: #d1fae5;
}

@media (max-width: 550px) {
    .reg-card { padding: 25px; }
    .form-row { grid-template-columns: 1fr; gap: 0; }
    .header-text h2 { font-size: 1.4rem; }
}
</style>
</head>
<body>

<div class="reg-card">
    <div class="logo-container">
        <div class="health-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2" width="40" height="40">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke="currentColor" fill="none"/>
                <circle cx="12" cy="12" r="10" stroke="currentColor" fill="none"/>
            </svg>
        </div>
        <div class="header-text">
            <h2>Health Monitor</h2>
            <p>Enter your credentials to access your health dashboard</p>
        </div>
    </div>

    <form id="registrationForm">
        <div class="form-row">
            <div class="input-box">
                <label>First Name</label>
                <input type="text" id="firstName" placeholder="Enter first name" required>
            </div>
            <div class="input-box">
                <label>Middle Name</label>
                <input type="text" id="middleName" placeholder="Middle name">
            </div>
        </div>

        <div class="input-box">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Enter last name" required>
        </div>

        <div class="form-row">
            <div class="input-box">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            <div class="input-box">
                <label>Age</label>
                <input type="number" id="age" placeholder="Age" required>
            </div>
        </div>

        <div class="input-box">
            <label>Email</label>
            <input type="email" id="email" placeholder="your@email.com" required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" id="password" placeholder="Create password" required>
        </div>

        <div class="form-row">
            <div class="input-box">
                <label>Gender</label>
                <select id="gender" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="input-box">
                <label>Blood Group</label>
                <select id="blood" required>
                    <option value="">Select</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                </select>
            </div>
        </div>

        <div class="input-box">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="+91 98765 43210">
        </div>

        <button type="submit" class="btn-submit">Login & Continue</button>
        <p id="errorMsg"></p>
    </form>
</div>

<script>
document.getElementById('registrationForm').addEventListener('submit', function(e) {
    e.preventDefault();

    // Get form values
    const firstName = document.getElementById('firstName').value.trim();
    const middleName = document.getElementById('middleName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const dob = document.getElementById('dob').value;
    const age = document.getElementById('age').value;
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const gender = document.getElementById('gender').value;
    const bloodGroup = document.getElementById('blood').value;
    const phone = document.getElementById('phone').value || 'Not provided';

    // SPECIFIC CREDENTIALS VALIDATION
    // Only these exact details will work
    const isValid = (
        firstName === "Tithi" &&
        middleName === "Bharatkumar" &&
        lastName === "Patel" &&
        dob === "2007-12-07" &&
        email === "ta0122007@gmail.com" &&
        password === "Tithi0712" &&
        gender === "Female" &&
        age === "19"
    );

    if (isValid) {
        // Save user data to localStorage
        const userData = {
            firstName: firstName,
            middleName: middleName,
            lastName: lastName,
            dob: dob,
            age: age,
            email: email,
            password: password,
            gender: gender,
            bloodGroup: bloodGroup,
            phone: phone,
            registrationDate: new Date().toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            })
        };
        
        localStorage.setItem('healthUser', JSON.stringify(userData));
        
        // Show success message
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.innerHTML = "✅ Login successful! Redirecting to dashboard...";
        errorMsg.style.color = "#10b981";
        errorMsg.style.background = "#d1fae5";
        
        // Redirect to dashboard after 1 second
        setTimeout(() => {
            window.location.href = "login.html";
        }, 1000);
    } else {
        // Show error message for invalid credentials
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.innerHTML = "❌ Invalid credentials! Please check your details.";
        errorMsg.style.color = "#dc2626";
        errorMsg.style.background = "#fee2e2";
        
        // Clear error after 3 seconds
        setTimeout(() => {
            errorMsg.innerHTML = "";
            errorMsg.style.background = "transparent";
        }, 3000);
    }
});
</script>

</body>
</html>
